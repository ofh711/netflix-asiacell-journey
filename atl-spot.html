<script>
  if (typeof location !== 'undefined' && new URLSearchParams(location.search).has('record')) {

<body>
<div id="root" style="position: fixed; inset: 0;"></div>

<script src="vendor/react.development.js"></script>
<script src="vendor/react-dom.development.js"></script>
<script src="vendor/babel.min.js"></script>

<script type="text/babel" data-presets="env,react">
const { useState, useEffect, useRef, useMemo, useContext, createContext } = React;

// ─── Aspect ratio (?aspect=1x1|9x16|16x9, default 16x9) ───────────────────────
const ASPECT = (typeof location !== 'undefined' && new URLSearchParams(location.search).get('aspect')) || '16x9';
const STAGE_W = ASPECT === '1x1' ? 1080 : ASPECT === '9x16' ? 1080 : 1920;
const STAGE_H = ASPECT === '1x1' ? 1080 : ASPECT === '9x16' ? 1920 : 1080;

// ─── Easing & helpers ────────────────────────────────────────────────────────
const Easing = {
  linear: (t) => t,
  easeInQuad: (t) => t * t,
  easeOutQuad: (t) => t * (2 - t),
  easeInCubic: (t) => t * t * t,
  easeOutCubic: (t) => (--t) * t * t + 1,
  easeInOutCubic: (t) => (t < 0.5 ? 4 * t * t * t : (t - 1) * (2 * t - 2) * (2 * t - 2) + 1),
  easeOutBack: (t) => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); },
  easeInOutQuart: (t) => (t < 0.5 ? 8 * t * t * t * t : 1 - 8 * (--t) * t * t * t),
};
const clamp = (v, min, max) => Math.max(min, Math.min(max, v));
function interpolate(input, output, ease = Easing.linear) {
  return (t) => {
    if (t <= input[0]) return output[0];
    if (t >= input[input.length - 1]) return output[output.length - 1];
    for (let i = 0; i < input.length - 1; i++) {
      if (t >= input[i] && t <= input[i + 1]) {
        const span = input[i + 1] - input[i];
        const local = span === 0 ? 0 : (t - input[i]) / span;
        const e = Array.isArray(ease) ? (ease[i] || Easing.linear) : ease;
        return output[i] + (output[i + 1] - output[i]) * e(local);
      }
    }
    return output[output.length - 1];
  };
}

// ─── Sprite/Stage ────────────────────────────────────────────────────────────
const TimelineContext = createContext({ time: 0, duration: 20 });
const SpriteContext = createContext({ localTime: 0, progress: 0, duration: 0 });
const useTimeline = () => useContext(TimelineContext);
const useSprite = () => useContext(SpriteContext);

function Sprite({ start = 0, end = Infinity, children }) {
  const { time } = useTimeline();
  if (time < start || time > end) return null;
  const duration = end - start;
  const localTime = Math.max(0, time - start);
  const progress = duration > 0 ? clamp(localTime / duration, 0, 1) : 0;
  return (
    <SpriteContext.Provider value={{ localTime, progress, duration }}>
      {children}
    </SpriteContext.Provider>
  );
}

function Stage({ width, height, duration, background = '#000', children }) {
  const recordMode = new URLSearchParams(location.search).has('record');
  const [time, setTime] = useState(0);
  const [playing, setPlaying] = useState(!recordMode);
  const [scale, setScale] = useState(1);
  const stageRef = useRef(null);
  const rafRef = useRef(null);
  const lastTsRef = useRef(null);

  useEffect(() => {
    if (recordMode) { setScale(1); return; }
    if (!stageRef.current) return;
    const el = stageRef.current;
    const measure = () => {
      const barH = 40;
      const s = Math.min(el.clientWidth / width, (el.clientHeight - barH) / height);
      setScale(Math.max(0.05, s));
    };
    measure();
    const ro = new ResizeObserver(measure);
    ro.observe(el);
    return () => ro.disconnect();
  }, [width, height, recordMode]);

  useEffect(() => {
    if (recordMode) {
      window.__record = { setTime, ready: true };
      return () => { delete window.__record; };
    }
  }, [recordMode]);

  useEffect(() => {
    if (!playing || recordMode) { lastTsRef.current = null; return; }
    const step = (ts) => {
      if (lastTsRef.current == null) lastTsRef.current = ts;
      const dt = (ts - lastTsRef.current) / 1000;
      lastTsRef.current = ts;
      setTime((t) => (t + dt) % duration);
      rafRef.current = requestAnimationFrame(step);
    };
    rafRef.current = requestAnimationFrame(step);
    return () => { if (rafRef.current) cancelAnimationFrame(rafRef.current); };
  }, [playing, duration, recordMode]);

  useEffect(() => {
    const onKey = (e) => {
      if (e.code === 'Space') { e.preventDefault(); setPlaying(p => !p); }
      else if (e.code === 'ArrowLeft') setTime(t => clamp(t - 0.5, 0, duration));
      else if (e.code === 'ArrowRight') setTime(t => clamp(t + 0.5, 0, duration));
      else if (e.key === '0' || e.code === 'Home') setTime(0);
    };
    window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);
  }, [duration]);

  const ctxValue = useMemo(() => ({ time, duration }), [time, duration]);

  if (recordMode) {
    return (
      <div style={{ width, height, background, position: 'absolute', top: 0, left: 0, overflow: 'hidden' }}>
        <TimelineContext.Provider value={ctxValue}>{children}</TimelineContext.Provider>
      </div>
    );
  }
  return (
    <div ref={stageRef} style={{ position: 'absolute', inset: 0, background: '#0a0a0a', display: 'flex', flexDirection: 'column', alignItems: 'center' }}>
      <div style={{ flex: 1, width: '100%', display: 'flex', alignItems: 'center', justifyContent: 'center', overflow: 'hidden' }}>
        <div style={{ width, height, background, position: 'relative', transform: `scale(${scale})`, boxShadow: '0 20px 60px rgba(0,0,0,0.4)', overflow: 'hidden' }}>
          <TimelineContext.Provider value={ctxValue}>{children}</TimelineContext.Provider>
        </div>
      </div>
      <div style={{ padding: '8px 16px', color: '#fff', fontFamily: 'monospace', fontSize: 12 }}>
        {time.toFixed(2)}s / {duration}s · {ASPECT} · space=play, ←/→=seek
      </div>
    </div>
  );
}

// ─── Brand ──────────────────────────────────────────────────────────────────
const BRAND = {
  asiacellRed: '#E30613', asiacellRedDeep: '#B5050F', asiacellRedLight: '#FF2D3A',
  netflixRed: '#E50914',
  asiacellLogoSrc: 'project/assets/asiacell-logo.png',
};

// ─── Reusable Netflix-UI phone screen (matches the KV) ───────────────────────
function NetflixUIPhone({ progress = 1 }) {

      <div style={{ position: 'absolute', top: 0, left: 0, right: 0, height: 44, display: 'flex', justifyContent: 'space-between', alignItems: 'center', padding: '14px 28px 0', fontSize: 15, fontWeight: 600, color: '#fff', zIndex: 30, fontFamily: '-apple-system, system-ui' }}>
        <span>9:41</span>
        <span style={{ display: 'flex', gap: 6, alignItems: 'center' }}>
          <svg width="18" height="11" viewBox="0 0 18 11"><rect x="0" y="6" width="3" height="5" rx="0.6" fill="#fff"/><rect x="5" y="4" width="3" height="7" rx="0.6" fill="#fff"/><rect x="10" y="2" width="3" height="9" rx="0.6" fill="#fff"/><rect x="15" y="0" width="3" height="11" rx="0.6" fill="#fff"/></svg>
          <svg width="24" height="11" viewBox="0 0 24 11"><rect x="0.5" y="0.5" width="20" height="10" rx="2.5" stroke="rgba(255,255,255,0.5)" fill="none"/><rect x="2" y="2" width="17" height="7" rx="1" fill="#fff"/></svg>
        </span>
      </div>

      <div style={{ paddingTop: 56 }}>
        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', padding: '8px 22px 6px' }}>
          <div style={{ fontFamily: '"Bebas Neue", Impact, sans-serif', fontSize: 36, color: '#E50914', fontWeight: 900, letterSpacing: '0.05em', transform: 'scaleY(1.15)', textShadow: '0 4px 18px rgba(229,9,20,0.6)' }}>NETFLIX</div>
          <div style={{ width: 28, height: 28, borderRadius: 6, background: 'linear-gradient(135deg, #ff8a00, #ff3d3d)' }} />
        </div>
        <div style={{ display: 'flex', gap: 22, padding: '4px 22px 14px', fontSize: 13, fontWeight: 600 }}>
          <span style={{ color: '#fff' }}>الرئيسية</span>
          <span style={{ color: 'rgba(255,255,255,0.55)' }}>مسلسلات</span>
          <span style={{ color: 'rgba(255,255,255,0.55)' }}>أفلام</span>
          <span style={{ color: 'rgba(255,255,255,0.55)' }}>جديد</span>
        </div>

        <div style={{
          margin: '0 16px 22px', height: 360, borderRadius: 14,
          background: 'radial-gradient(ellipse at 30% 30%, rgba(229,9,20,0.6) 0%, transparent 60%), linear-gradient(135deg, #1a0508 0%, #4a0612 50%, #0a0205 100%)',
          position: 'relative', overflow: 'hidden', boxShadow: '0 14px 40px rgba(0,0,0,0.6)',
        }}>
          <div style={{ position: 'absolute', top: 14, right: 14, background: 'rgba(0,0,0,0.5)', padding: '4px 10px', borderRadius: 4, fontSize: 11, fontWeight: 700, color: '#fff', letterSpacing: '0.1em', backdropFilter: 'blur(10px)' }}>جديد على نتفلكس</div>
          <div style={{ position: 'absolute', bottom: 60, left: 16, right: 16, textAlign: 'right', direction: 'rtl', fontFamily: 'Tajawal', fontSize: 28, fontWeight: 900, color: '#fff', lineHeight: 1.1, textShadow: '0 4px 20px rgba(0,0,0,0.9)', zIndex: 5 }}>المسلسل العراقي الأكثر مشاهدةً</div>
          <div style={{ position: 'absolute', bottom: 36, left: 16, display: 'flex', gap: 8, fontSize: 11, color: 'rgba(255,255,255,0.8)', zIndex: 5 }}>
            <span style={{ background: 'rgba(0,0,0,0.4)', padding: '3px 8px', borderRadius: 3 }}>2026</span>
            <span style={{ background: 'rgba(0,0,0,0.4)', padding: '3px 8px', borderRadius: 3 }}>13+</span>
            <span style={{ background: 'rgba(0,0,0,0.4)', padding: '3px 8px', borderRadius: 3 }}>دراما</span>
          </div>
          <div style={{ position: 'absolute', bottom: 14, left: 16, right: 16, display: 'flex', gap: 8, zIndex: 5 }}>
            <div style={{ flex: 1, background: '#fff', color: '#000', padding: 10, borderRadius: 6, fontSize: 14, fontWeight: 700, textAlign: 'center', direction: 'rtl' }}>▶  تشغيل</div>
            <div style={{ flex: 1, background: 'rgba(120,120,120,0.55)', color: '#fff', padding: 10, borderRadius: 6, fontSize: 14, fontWeight: 700, textAlign: 'center', direction: 'rtl' }}>＋  قائمتي</div>
          </div>
          <div style={{ position: 'absolute', inset: 0, background: 'linear-gradient(180deg, transparent 50%, rgba(0,0,0,0.85) 100%)' }} />
        </div>

        <div style={{ padding: '0 16px 18px', transform: `translateY(${tilesShift}px)` }}>
          <div style={{ color: '#fff', fontSize: 17, fontWeight: 700, marginBottom: 10, direction: 'rtl', textAlign: 'right', fontFamily: 'Tajawal' }}>الأكثر مشاهدةً في العراق اليوم</div>
          <div style={{ display: 'flex', gap: 8 }}>
            {[
              ['#6e0000', '#e50914', '#1'],
              ['#003e7e', '#0070d8', '#2'],
              ['#2e0e2e', '#8e2ee5', '#3'],
              ['#5e3500', '#e57c14', '#4'],
            ].map(([c1, c2, rank], i) => (
              <div key={i} style={{ width: 96, height: 144, borderRadius: 6, flexShrink: 0, background: `linear-gradient(135deg, ${c1} 0%, ${c2} 100%)`, position: 'relative' }}>
                <div style={{ position: 'absolute', inset: 0, background: 'linear-gradient(180deg, transparent 60%, rgba(0,0,0,0.5) 100%)', borderRadius: 6 }} />
                <div style={{ position: 'absolute', top: 4, right: 6, fontFamily: '"Bebas Neue", Impact, sans-serif', fontSize: 14, fontWeight: 900, color: '#fff', textShadow: '0 2px 6px rgba(0,0,0,0.8)' }}>{rank}</div>
              </div>
            ))}
          </div>
        </div>
      </div>
    </div>
  );
}

function PhoneFrame({ children, width = 460, height = 950 }) {
  return (
    <div style={{ width, height, background: '#0a0a0a', borderRadius: 60, padding: 8, boxShadow: '0 80px 140px rgba(0,0,0,0.85), 0 30px 60px rgba(227,6,19,0.18), 0 0 0 2px #2a2a2a, inset 0 0 0 2px #1a1a1a', position: 'relative' }}>
      <div style={{ width: '100%', height: '100%', borderRadius: 50, overflow: 'hidden', background: '#000', position: 'relative' }}>
        <div style={{ position: 'absolute', top: 14, left: '50%', transform: 'translateX(-50%)', width: 130, height: 36, borderRadius: 18, background: '#000', zIndex: 50 }} />
        {children}
        <div style={{ position: 'absolute', bottom: 8, left: '50%', transform: 'translateX(-50%)', width: 150, height: 5, borderRadius: 3, background: 'rgba(255,255,255,0.7)', zIndex: 50 }} />
      </div>
    </div>
  );
}

// ─── Aspect-aware position helpers ──────────────────────────────────────────
// Center anchored layouts that work for all aspects.
function CenteredTitle({ children, fontSize, weight = 800, color = '#fff', y, opacity = 1, ty = 0 }) {
  return (
    <div style={{
      position: 'absolute', left: 0, right: 0, top: y,
      textAlign: 'center', direction: 'rtl', fontFamily: '"Tajawal", "Cairo", system-ui',
      opacity, transform: `translateY(${ty}px)`,
      padding: '0 80px',
    }}>
      <div style={{ fontSize, fontWeight: weight, color, lineHeight: 1.15, letterSpacing: '-0.01em', textShadow: '0 4px 30px rgba(0,0,0,0.5)' }}>
        {children}
      </div>
    </div>
  );
}

// ─── SCENES ─────────────────────────────────────────────────────────────────

// Scene 1 (0-2.5s): Asiacell brand intro — red burst, logo emerges
function SceneIntro() {
  const { progress } = useSprite();
  const bgScale = interpolate([0, 1], [1, 1.08])(progress);
  const markScale = interpolate([0, 0.4, 0.7, 1], [0.4, 1.05, 1, 0.95], Easing.easeOutBack)(progress);
  const markOpacity = interpolate([0, 0.2, 0.85, 1], [0, 1, 1, 0])(progress);
  const logoH = ASPECT === '16x9' ? 360 : ASPECT === '9x16' ? 280 : 280;

  return (
    <div style={{
      position: 'absolute', inset: 0,
      background: `radial-gradient(circle at 50% 50%, ${BRAND.asiacellRed} 0%, ${BRAND.asiacellRedDeep} 60%, #6B0000 100%)`,
      transform: `scale(${bgScale})`,
      display: 'flex', alignItems: 'center', justifyContent: 'center', overflow: 'hidden',
    }}>
      {[1, 2, 3, 4].map(i => (
        <div key={i} style={{
          position: 'absolute',
          width: 400 + i * 350, height: 400 + i * 350, borderRadius: '50%',
          border: `2px solid rgba(255,255,255,${0.06 + (1 - i/5) * 0.04})`,
          opacity: clamp(progress * 2 - i * 0.05, 0, 1),
        }} />
      ))}
      <div style={{ opacity: markOpacity, transform: `scale(${markScale})` }}>
        <img src={BRAND.asiacellLogoSrc} alt="Asiacell" style={{ height: logoH, width: 'auto', filter: 'brightness(0) invert(1)' }} />
      </div>
    </div>
  );
}

// Scene 2 (2.5-7s): Phone reveal with Netflix UI animation
function ScenePhoneReveal() {
  const { progress } = useSprite();
  const phoneIn = Easing.easeOutCubic(clamp(progress / 0.35, 0, 1));
  const phoneOut = clamp((progress - 0.85) / 0.15, 0, 1);
  const phoneOpacity = phoneIn * (1 - phoneOut);
  const phoneTy = (1 - phoneIn) * 80 - phoneOut * 40;
  const phoneScale = ASPECT === '16x9' ? 0.95 : ASPECT === '9x16' ? 0.95 : 0.6;

  // Caption emerges after phone
  const capP = clamp((progress - 0.4) / 0.6, 0, 1);
  const capIn = Easing.easeOutCubic(clamp(capP / 0.25, 0, 1));
  const capOp = capIn * (1 - phoneOut);
  const capTy = (1 - capIn) * 24;

  // Aspect-specific positioning
  const phoneTop = ASPECT === '16x9' ? 65 : ASPECT === '9x16' ? 290 : 130;
  const phoneLeft = ASPECT === '16x9' ? 1300 : ASPECT === '9x16' ? (STAGE_W - 460) / 2 : (STAGE_W - 460) / 2;

  // Caption position (varies by aspect)
  const captionStyle = ASPECT === '16x9'
    ? { right: 'auto', left: 80, top: 320, width: 1100, textAlign: 'right' }
    : ASPECT === '9x16'
    ? { left: 0, right: 0, top: 1320, width: '100%', textAlign: 'center' }
    : { left: 0, right: 0, top: 770, width: '100%', textAlign: 'center' };

  const captionFont = ASPECT === '16x9' ? 90 : ASPECT === '9x16' ? 80 : 68;

  return (
    <div style={{
      position: 'absolute', inset: 0,
      background: 'radial-gradient(ellipse at 70% 50%, rgba(227,6,19,0.4) 0%, transparent 55%), linear-gradient(135deg, #0a0000 0%, #1a0508 50%, #0d0205 100%)',
      overflow: 'hidden',
    }}>
      {/* Glow */}
      <div style={{
        position: 'absolute',
        left: ASPECT === '16x9' ? 1000 : -100,
        top: ASPECT === '9x16' ? 800 : 200,
        width: 1100, height: 1100, borderRadius: '50%',
        background: `radial-gradient(circle, ${BRAND.asiacellRed}66 0%, transparent 60%)`,
        filter: 'blur(80px)',
      }} />

      {/* Phone */}
      <div style={{
        position: 'absolute',
        left: phoneLeft, top: phoneTop,
        opacity: phoneOpacity,
        transform: `translateY(${phoneTy}px) scale(${phoneScale})`,
        transformOrigin: 'center top',
      }}>
        <PhoneFrame>
          <NetflixUIPhone progress={progress} />
        </PhoneFrame>
      </div>

      {/* Caption */}
      <div style={{
        position: 'absolute',
        ...captionStyle,
        direction: 'rtl', fontFamily: '"Tajawal", "Cairo", system-ui',
        padding: ASPECT === '16x9' ? 0 : '0 60px',
        opacity: capOp, transform: `translateY(${capTy}px)`,
      }}>
        <div style={{ fontSize: captionFont, fontWeight: 800, color: '#fff', lineHeight: 1.15, textShadow: '0 4px 30px rgba(0,0,0,0.6)' }}>
          استمتع بـ <span style={{ color: BRAND.netflixRed }}>نتفلكس</span><br/>
          أينما كنت
        </div>
      </div>
    </div>
  );
}

// Scene 3 (7-12s): Logo lockup forms — Asiacell × NETFLIX
function SceneLockup() {
  const { progress } = useSprite();
  const acIn = Easing.easeOutCubic(clamp(progress / 0.2, 0, 1));
  const xIn = Easing.easeOutBack(clamp((progress - 0.18) / 0.15, 0, 1));
  const nfIn = Easing.easeOutCubic(clamp((progress - 0.32) / 0.2, 0, 1));
  const exit = clamp((progress - 0.85) / 0.15, 0, 1);
  const op = 1 - exit;

  const tagP = clamp((progress - 0.55) / 0.4, 0, 1);
  const tagIn = Easing.easeOutCubic(clamp(tagP / 0.3, 0, 1));
  const tagOp = tagIn * op;
  const tagTy = (1 - tagIn) * 24;

  const acH = ASPECT === '16x9' ? 200 : 160;
  const nfFont = ASPECT === '16x9' ? 160 : 120;
  const xFont = ASPECT === '16x9' ? 100 : 70;
  const gap = ASPECT === '16x9' ? 70 : 40;

  const lockupTop = ASPECT === '16x9' ? 360 : ASPECT === '9x16' ? 580 : 360;
  const tagTop = ASPECT === '16x9' ? 720 : ASPECT === '9x16' ? 1100 : 720;
  const tagFont = ASPECT === '16x9' ? 80 : ASPECT === '9x16' ? 78 : 60;

  return (
    <div style={{
      position: 'absolute', inset: 0,
      background: 'radial-gradient(ellipse at 50% 40%, rgba(227,6,19,0.35) 0%, transparent 55%), linear-gradient(135deg, #0a0000 0%, #1a0508 50%, #0d0205 100%)',
      overflow: 'hidden',
    }}>
      {/* Background pulse */}
      <div style={{
        position: 'absolute', left: '50%', top: '50%',
        width: 1400, height: 1400, borderRadius: '50%',
        background: `radial-gradient(circle, ${BRAND.asiacellRed}66 0%, transparent 60%)`,
        transform: `translate(-50%, -50%) scale(${0.5 + progress * 0.6})`,
        filter: 'blur(80px)', opacity: op,
      }} />

      {/* Lockup */}
      <div style={{
        position: 'absolute', left: 0, right: 0, top: lockupTop,
        display: 'flex', alignItems: 'center', justifyContent: 'center', gap,
      }}>
        <img src={BRAND.asiacellLogoSrc} alt="Asiacell" style={{
          height: acH, width: 'auto', filter: 'brightness(0) invert(1)',
          opacity: acIn * op, transform: `translateX(${(1 - acIn) * 40}px) scale(${0.92 + acIn * 0.08})`,
        }} />
        <div style={{
          fontSize: xFont, fontWeight: 200, color: 'rgba(255,255,255,0.6)', fontFamily: 'system-ui',
          opacity: xIn * op, transform: `scale(${0.4 + xIn * 0.6})`,
        }}>×</div>
        <div style={{
          fontFamily: '"Bebas Neue", "Oswald", Impact, sans-serif',
          fontSize: nfFont, fontWeight: 900, color: '#E50914', letterSpacing: '0.02em',
          transform: `scaleY(1.15) translateX(${-(1 - nfIn) * 40}px)`,
          textShadow: '0 8px 40px rgba(229,9,20,0.7)', lineHeight: 0.85,
          opacity: nfIn * op,
        }}>NETFLIX</div>
      </div>

      {/* Tagline */}
      <div style={{
        position: 'absolute', left: 0, right: 0, top: tagTop,
        textAlign: 'center', direction: 'rtl', fontFamily: '"Tajawal", "Cairo", system-ui',
        padding: ASPECT === '16x9' ? 0 : '0 60px',
        opacity: tagOp, transform: `translateY(${tagTy}px)`,
      }}>
        <div style={{ fontSize: tagFont, fontWeight: 800, color: '#fff', lineHeight: 1.15, textShadow: '0 4px 30px rgba(0,0,0,0.5)' }}>
          مشاهدة بلا حدود
        </div>
      </div>
    </div>
  );
}

// Scene 4 (12-16s): Benefits / sub-message
function SceneBenefits() {
  const { progress } = useSprite();
  const exit = clamp((progress - 0.85) / 0.15, 0, 1);
  const op = 1 - exit;

  const benefits = [
    { ar: 'بدون بطاقة ائتمان', icon: '⊘' },
    { ar: 'دفع فوري من رصيدك', icon: '⚡' },
    { ar: 'سهل · سريع · آمن', icon: '✓' },
  ];

  // Stagger benefit reveals
  const benefitProgress = (i) => {
    const start = i * 0.18;
    const local = clamp((progress - start) / 0.25, 0, 1);
    return Easing.easeOutCubic(local);
  };

  const isVertical = ASPECT !== '16x9';
  const benefitFont = ASPECT === '16x9' ? 50 : 38;
  const iconSize = ASPECT === '16x9' ? 80 : 60;
  const containerStyle = ASPECT === '16x9'
    ? { left: 0, right: 0, top: 380, padding: '0 120px', flexDirection: 'row', gap: 80, justifyContent: 'center' }
    : ASPECT === '9x16'
    ? { left: 0, right: 0, top: 600, padding: '0 80px', flexDirection: 'column', gap: 70, alignItems: 'center' }
    : { left: 0, right: 0, top: 280, padding: '0 80px', flexDirection: 'column', gap: 50, alignItems: 'center' };

  return (
    <div style={{
      position: 'absolute', inset: 0,
      background: 'radial-gradient(ellipse at 50% 50%, rgba(227,6,19,0.3) 0%, transparent 55%), linear-gradient(135deg, #0a0000 0%, #1a0508 100%)',
      overflow: 'hidden',
    }}>
      <div style={{
        position: 'absolute',
        display: 'flex',
        ...containerStyle,
      }}>
        {benefits.map((b, i) => {
          const p = benefitProgress(i);
          return (
            <div key={i} style={{
              display: 'flex', flexDirection: isVertical ? 'row' : 'column', alignItems: 'center',
              gap: isVertical ? 28 : 18, direction: 'rtl', textAlign: 'center',
              opacity: p * op,
              transform: `translateY(${(1 - p) * 30}px) scale(${0.95 + p * 0.05})`,
            }}>
              <div style={{
                width: iconSize * 1.6, height: iconSize * 1.6, borderRadius: '50%',
                background: `linear-gradient(135deg, ${BRAND.asiacellRedLight}, ${BRAND.asiacellRedDeep})`,
                display: 'flex', alignItems: 'center', justifyContent: 'center',
                color: '#fff', fontSize: iconSize * 0.55, fontWeight: 900,
                boxShadow: `0 14px 40px ${BRAND.asiacellRed}66`, fontFamily: 'system-ui',
                flexShrink: 0,
              }}>{b.icon}</div>
              <div style={{
                fontFamily: 'Tajawal, Cairo, sans-serif',
                fontSize: benefitFont, fontWeight: 800, color: '#fff',
                lineHeight: 1.2, textShadow: '0 4px 20px rgba(0,0,0,0.5)',
              }}>{b.ar}</div>
            </div>
          );
        })}
      </div>

      {/* Header tagline */}
      <div style={{
        position: 'absolute', left: 0, right: 0,
        top: ASPECT === '16x9' ? 200 : ASPECT === '9x16' ? 300 : 130,
        textAlign: 'center', direction: 'rtl', fontFamily: '"Tajawal", "Cairo", system-ui',
        opacity: Easing.easeOutCubic(clamp(progress / 0.2, 0, 1)) * op,
        padding: '0 60px',
      }}>
        <div style={{ fontSize: ASPECT === '16x9' ? 70 : 56, fontWeight: 800, color: BRAND.asiacellRedLight, lineHeight: 1.15, letterSpacing: '-0.01em' }}>
          اشترك بثلاث خطوات
        </div>
      </div>
    </div>
  );
}

// Scene 5 (16-20s): End card with CTA + URL
function SceneEnd() {
  const { progress } = useSprite();
  const t = Easing.easeOutCubic(clamp(progress * 1.5, 0, 1));
  const lockupOp = clamp(progress * 4, 0, 1);
  const tagP = clamp((progress - 0.18) / 0.5, 0, 1);
  const tagIn = Easing.easeOutCubic(clamp(tagP / 0.3, 0, 1));
  const ctaP = clamp((progress - 0.35) / 0.4, 0, 1);
  const ctaIn = Easing.easeOutBack(clamp(ctaP / 0.4, 0, 1));

  const acH = ASPECT === '16x9' ? 220 : 170;
  const nfFont = ASPECT === '16x9' ? 170 : 130;
  const xFont = ASPECT === '16x9' ? 110 : 80;
  const gap = ASPECT === '16x9' ? 80 : 50;

  const lockupTop = ASPECT === '16x9' ? 280 : ASPECT === '9x16' ? 480 : 280;
  const tagTop = ASPECT === '16x9' ? 620 : ASPECT === '9x16' ? 920 : 620;
  const tagFont = ASPECT === '16x9' ? 92 : ASPECT === '9x16' ? 86 : 68;
  const subFont = ASPECT === '16x9' ? 32 : 26;
  const ctaTop = ASPECT === '16x9' ? 850 : ASPECT === '9x16' ? 1300 : 880;

  return (
    <div style={{
      position: 'absolute', inset: 0,
      background: `linear-gradient(135deg, #000 0%, #1a0508 40%, ${BRAND.asiacellRedDeep} 100%)`,
      overflow: 'hidden',
    }}>
      {/* Sun rays */}
      <svg width="100%" height="100%" style={{ position: 'absolute', inset: 0, opacity: t * 0.22 }}>
        {[...Array(20)].map((_, i) => {
          const angle = (i / 20) * Math.PI * 2;
          const len = 1500;
          const cx = STAGE_W / 2, cy = STAGE_H / 2;
          return <line key={i} x1={cx} y1={cy}
            x2={cx + Math.cos(angle) * len * t} y2={cy + Math.sin(angle) * len * t}
            stroke={BRAND.asiacellRed} strokeWidth="2" opacity="0.4" />;
        })}
      </svg>

      <div style={{
        position: 'absolute', left: '50%', top: '50%',
        width: 1300, height: 1300, borderRadius: '50%',
        background: `radial-gradient(circle, ${BRAND.asiacellRed}77 0%, transparent 60%)`,
        transform: `translate(-50%, -50%) scale(${0.5 + t * 0.7})`,
        filter: 'blur(80px)',
      }} />

      {/* Lockup */}
      <div style={{
        position: 'absolute', left: 0, right: 0, top: lockupTop,
        display: 'flex', alignItems: 'center', justifyContent: 'center', gap,
        opacity: lockupOp, transform: `scale(${0.85 + t * 0.15})`,
      }}>
        <img src={BRAND.asiacellLogoSrc} alt="Asiacell" style={{ height: acH, width: 'auto', filter: 'brightness(0) invert(1)' }} />
        <div style={{ fontSize: xFont, fontWeight: 200, color: 'rgba(255,255,255,0.6)', fontFamily: 'system-ui' }}>×</div>
        <div style={{ fontFamily: '"Bebas Neue", Impact, sans-serif', fontSize: nfFont, fontWeight: 900, color: '#fff', letterSpacing: '0.02em', transform: 'scaleY(1.15)', textShadow: '0 8px 40px rgba(0,0,0,0.5)', lineHeight: 0.85 }}>NETFLIX</div>
      </div>

      {/* Tagline */}
      <div style={{
        position: 'absolute', left: 0, right: 0, top: tagTop,
        textAlign: 'center', direction: 'rtl', fontFamily: 'Tajawal, system-ui',
        padding: ASPECT === '16x9' ? 0 : '0 60px',
        opacity: tagIn, transform: `translateY(${(1 - tagIn) * 24}px)`,
      }}>
        <div style={{ fontSize: tagFont, fontWeight: 800, color: '#fff', lineHeight: 1.15, textShadow: '0 4px 30px rgba(0,0,0,0.4)' }}>
          مشاهدة بلا حدود
        </div>
        <div style={{ marginTop: 18, fontSize: subFont, fontWeight: 500, color: 'rgba(255,255,255,0.85)' }}>
          اشترك مباشرةً من رصيد آسياسيل
        </div>
      </div>

      {/* CTA + URL pill */}
      <div style={{
        position: 'absolute', left: '50%', top: ctaTop, transform: `translateX(-50%) scale(${ctaIn})`,
        display: 'flex', alignItems: 'center', gap: 14, direction: 'rtl',
        background: 'rgba(255,255,255,0.06)', backdropFilter: 'blur(20px)',
        border: '1.5px solid rgba(255,255,255,0.18)', borderRadius: 100,
        padding: '8px 14px 8px 28px',
        boxShadow: '0 14px 40px rgba(0,0,0,0.4)',
      }}>
        <div style={{
          background: `linear-gradient(135deg, ${BRAND.asiacellRedLight}, ${BRAND.asiacellRedDeep})`,
          color: '#fff', borderRadius: 100, padding: '14px 30px',
          fontSize: ASPECT === '16x9' ? 22 : 20, fontWeight: 700,
          boxShadow: `0 6px 20px ${BRAND.asiacellRed}88`,
        }}>اشترك الآن</div>
        <div style={{ fontFamily: 'JetBrains Mono, monospace', color: 'rgba(255,255,255,0.9)', fontSize: ASPECT === '16x9' ? 22 : 18, letterSpacing: '0.05em', direction: 'ltr' }}>
          netflix.com/iq
        </div>
      </div>
    </div>
  );
}

// ─── App ────────────────────────────────────────────────────────────────────
const TOTAL = 20;

function App() {
  return (
    <Stage width={STAGE_W} height={STAGE_H} duration={TOTAL}>
      <Sprite start={0}    end={2.5}>  <SceneIntro /></Sprite>
      <Sprite start={2.5}  end={7}>    <ScenePhoneReveal /></Sprite>
      <Sprite start={7}    end={12}>   <SceneLockup /></Sprite>
      <Sprite start={12}   end={16}>   <SceneBenefits /></Sprite>
      <Sprite start={16}   end={20}>   <SceneEnd /></Sprite>
    </Stage>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
