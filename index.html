<script type="text/babel" data-presets="env,react">
const { useState, useEffect, useRef, useMemo, useContext, createContext } = React;

// Orientation: ?orient=portrait switches the stage to 1080×1920 with re-laid-out scenes.
const IS_PORTRAIT = typeof window !== 'undefined' &&
  typeof location !== 'undefined' &&
  new URLSearchParams(location.search).get('orient') === 'portrait';
const STAGE_W = IS_PORTRAIT ? 1080 : 1920;
const STAGE_H = IS_PORTRAIT ? 1920 : 1080;

// ═══════════════════════════════════════════════════════════════
// ANIMATION ENGINE
// ═══════════════════════════════════════════════════════════════

const Easing = {
  linear: (t) => t,
  easeInQuad:    (t) => t * t,
  easeOutQuad:   (t) => t * (2 - t),
  easeInOutQuad: (t) => (t < 0.5 ? 2 * t * t : -1 + (4 - 2 * t) * t),
  easeInCubic:    (t) => t * t * t,
  easeOutCubic:   (t) => (--t) * t * t + 1,
  easeInOutCubic: (t) => (t < 0.5 ? 4 * t * t * t : (t - 1) * (2 * t - 2) * (2 * t - 2) + 1),
  easeInQuart:    (t) => t * t * t * t,
  easeOutQuart:   (t) => 1 - (--t) * t * t * t,
  easeInOutQuart: (t) => (t < 0.5 ? 8 * t * t * t * t : 1 - 8 * (--t) * t * t * t),
  easeInExpo:  (t) => (t === 0 ? 0 : Math.pow(2, 10 * (t - 1))),
  easeOutExpo: (t) => (t === 1 ? 1 : 1 - Math.pow(2, -10 * t)),
  easeInOutExpo: (t) => {
    if (t === 0) return 0; if (t === 1) return 1;
    if (t < 0.5) return 0.5 * Math.pow(2, 20 * t - 10);
    return 1 - 0.5 * Math.pow(2, -20 * t + 10);
  },
  easeInSine:    (t) => 1 - Math.cos((t * Math.PI) / 2),
  easeOutSine:   (t) => Math.sin((t * Math.PI) / 2),
  easeInOutSine: (t) => -(Math.cos(Math.PI * t) - 1) / 2,
  easeOutBack: (t) => {
    const c1 = 1.70158, c3 = c1 + 1;
    return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2);
  },
  easeInBack: (t) => {
    const c1 = 1.70158, c3 = c1 + 1;
    return c3 * t * t * t - c1 * t * t;
  },
  easeInOutBack: (t) => {
    const c1 = 1.70158, c2 = c1 * 1.525;
    return t < 0.5
      ? (Math.pow(2 * t, 2) * ((c2 + 1) * 2 * t - c2)) / 2
      : (Math.pow(2 * t - 2, 2) * ((c2 + 1) * (t * 2 - 2) + c2) + 2) / 2;
  },
  easeOutElastic: (t) => {
    const c4 = (2 * Math.PI) / 3;
    if (t === 0) return 0; if (t === 1) return 1;
    return Math.pow(2, -10 * t) * Math.sin((t * 10 - 0.75) * c4) + 1;
  },
};

const clamp = (v, min, max) => Math.max(min, Math.min(max, v));

function interpolate(input, output, ease = Easing.linear) {
  return (t) => {
    if (t <= input[0]) return output[0];
    if (t >= input[input.length - 1]) return output[output.length - 1];
    for (let i = 0; i < input.length - 1; i++) {
      if (t >= input[i] && t <= input[i + 1]) {
        const span = input[i + 1] - input[i];
        const local = span === 0 ? 0 : (t - input[i]) / span;
        const easeFn = Array.isArray(ease) ? (ease[i] || Easing.linear) : ease;
        return output[i] + (output[i + 1] - output[i]) * easeFn(local);
      }
    }
    return output[output.length - 1];
  };
}

function animate({ from = 0, to = 1, start = 0, end = 1, ease = Easing.easeInOutCubic }) {
  return (t) => {
    if (t <= start) return from;
    if (t >= end) return to;
    return from + (to - from) * ease((t - start) / (end - start));
  };
}

const TimelineContext = createContext({ time: 0, duration: 10, playing: false });
const useTime = () => useContext(TimelineContext).time;
const useTimeline = () => useContext(TimelineContext);
const SpriteContext = createContext({ localTime: 0, progress: 0, duration: 0 });
const useSprite = () => useContext(SpriteContext);

function Sprite({ start = 0, end = Infinity, children, keepMounted = false }) {
  const { time } = useTimeline();
  const visible = time >= start && time <= end;
  if (!visible && !keepMounted) return null;
  const duration = end - start;
  const localTime = Math.max(0, time - start);
  const progress = duration > 0 && isFinite(duration) ? clamp(localTime / duration, 0, 1) : 0;
  const value = { localTime, progress, duration, visible };
  return (
    <SpriteContext.Provider value={value}>
      {typeof children === 'function' ? children(value) : children}
    </SpriteContext.Provider>
  );
}

function Stage({ width = 1280, height = 720, duration = 10, background = '#f6f4ef',
  loop = true, autoplay = true, persistKey = 'animstage', children }) {
  const recordMode = typeof window !== 'undefined' &&
    typeof location !== 'undefined' &&
    new URLSearchParams(location.search).has('record');
  const [time, setTime] = useState(() => {
    if (recordMode) return 0;
    try {
      const v = parseFloat(localStorage.getItem(persistKey + ':t') || '0');
      return isFinite(v) ? clamp(v, 0, duration) : 0;
    } catch { return 0; }
  });
  const [playing, setPlaying] = useState(autoplay && !recordMode);
  const [hoverTime, setHoverTime] = useState(null);
  const [scale, setScale] = useState(1);
  const stageRef = useRef(null);
  const canvasRef = useRef(null);
  const rafRef = useRef(null);
  const lastTsRef = useRef(null);

  useEffect(() => {
    if (recordMode) return;
    try { localStorage.setItem(persistKey + ':t', String(time)); } catch {}
  }, [time, persistKey, recordMode]);

  useEffect(() => {
    if (recordMode) { setScale(1); return; }
    if (!stageRef.current) return;
    const el = stageRef.current;
    const measure = () => {
      const barH = 44;
      const s = Math.min(el.clientWidth / width, (el.clientHeight - barH) / height);
      setScale(Math.max(0.05, s));
    };
    measure();
    const ro = new ResizeObserver(measure);
    ro.observe(el);
    window.addEventListener('resize', measure);
    return () => { ro.disconnect(); window.removeEventListener('resize', measure); };
  }, [width, height, recordMode]);

  useEffect(() => {
    if (recordMode) {
      window.__record = { setTime, ready: true };
      return () => { delete window.__record; };
    }
  }, [recordMode]);

  useEffect(() => {
    if (!playing || recordMode) { lastTsRef.current = null; return; }
    const step = (ts) => {
      if (lastTsRef.current == null) lastTsRef.current = ts;
      const dt = (ts - lastTsRef.current) / 1000;
      lastTsRef.current = ts;
      setTime((t) => {
        let next = t + dt;
        if (next >= duration) {
          if (loop) next = next % duration;
          else { next = duration; setPlaying(false); }
        }
        return next;
      });
      rafRef.current = requestAnimationFrame(step);
    };
    rafRef.current = requestAnimationFrame(step);
    return () => { if (rafRef.current) cancelAnimationFrame(rafRef.current); lastTsRef.current = null; };
  }, [playing, duration, loop]);

  useEffect(() => {
    const onKey = (e) => {
      if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA')) return;
      if (e.code === 'Space') { e.preventDefault(); setPlaying(p => !p); }
      else if (e.code === 'ArrowLeft') setTime(t => clamp(t - (e.shiftKey ? 1 : 0.1), 0, duration));
      else if (e.code === 'ArrowRight') setTime(t => clamp(t + (e.shiftKey ? 1 : 0.1), 0, duration));
      else if (e.key === '0' || e.code === 'Home') setTime(0);
    };
    window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);
  }, [duration]);

  const displayTime = hoverTime != null ? hoverTime : time;
  const ctxValue = useMemo(
    () => ({ time: displayTime, duration, playing, setTime, setPlaying }),
    [displayTime, duration, playing]
  );

  if (recordMode) {
    return (
      <div style={{
        width, height, background, position: 'absolute', top: 0, left: 0, overflow: 'hidden',
      }}>
        <TimelineContext.Provider value={ctxValue}>
          {children}
        </TimelineContext.Provider>
      </div>
    );
  }

  return (
    <div ref={stageRef} style={{
      position: 'absolute', inset: 0,
      display: 'flex', flexDirection: 'column', alignItems: 'center',
      background: '#0a0a0a', fontFamily: 'Inter, system-ui, sans-serif',
    }}>
      <div style={{ flex: 1, width: '100%', display: 'flex', alignItems: 'center',
        justifyContent: 'center', overflow: 'hidden', minHeight: 0 }}>
        <div ref={canvasRef} style={{
          width, height, background, position: 'relative',
          transform: `scale(${scale})`, transformOrigin: 'center',
          flexShrink: 0, boxShadow: '0 20px 60px rgba(0,0,0,0.4)', overflow: 'hidden',
        }}>
          <TimelineContext.Provider value={ctxValue}>
            {children}
          </TimelineContext.Provider>
        </div>
      </div>
      <PlaybackBar
        time={displayTime} actualTime={time} duration={duration} playing={playing}
        onPlayPause={() => setPlaying(p => !p)}
        onReset={() => setTime(0)}
        onSeek={(t) => setTime(t)}
        onHover={(t) => setHoverTime(t)}
      />
    </div>
  );
}

function PlaybackBar({ time, duration, playing, onPlayPause, onReset, onSeek, onHover }) {
  const trackRef = useRef(null);
  const [dragging, setDragging] = useState(false);

  const timeFromEvent = React.useCallback((e) => {
    const rect = trackRef.current.getBoundingClientRect();
    return clamp((e.clientX - rect.left) / rect.width, 0, 1) * duration;
  }, [duration]);

  const onTrackMove = (e) => {
    if (!trackRef.current) return;
    if (dragging) onSeek(timeFromEvent(e));
    else onHover(timeFromEvent(e));
  };

  useEffect(() => {
    if (!dragging) return;
    const onUp = () => setDragging(false);
    const onMove = (e) => { if (trackRef.current) onSeek(timeFromEvent(e)); };
    window.addEventListener('mouseup', onUp);
    window.addEventListener('mousemove', onMove);
    return () => { window.removeEventListener('mouseup', onUp); window.removeEventListener('mousemove', onMove); };
  }, [dragging, timeFromEvent, onSeek]);

  const pct = duration > 0 ? (time / duration) * 100 : 0;
  const fmt = (t) => {
    const total = Math.max(0, t);
    const m = Math.floor(total / 60);
    const s = Math.floor(total % 60);
    const cs = Math.floor((total * 100) % 100);
    return `${m}:${String(s).padStart(2,'0')}.${String(cs).padStart(2,'0')}`;
  };
  const mono = 'JetBrains Mono, ui-monospace, monospace';

  return (
    <div style={{
      display: 'flex', alignItems: 'center', gap: 12,
      padding: '8px 16px', background: 'rgba(20,20,20,0.92)',
      borderTop: '1px solid rgba(255,255,255,0.08)',
      width: '100%', maxWidth: 680, alignSelf: 'center',
      borderRadius: 8, color: '#f6f4ef',
      fontFamily: 'Inter, system-ui, sans-serif', userSelect: 'none', flexShrink: 0,
    }}>
      <IconBtn onClick={onReset} title="Return to start (0)">
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
          <path d="M3 2v10M12 2L5 7l7 5V2z" stroke="currentColor" strokeWidth="1.5" strokeLinejoin="round" strokeLinecap="round"/>
        </svg>
      </IconBtn>
      <IconBtn onClick={onPlayPause} title="Play/pause (space)">
        {playing ? (
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
            <rect x="3" y="2" width="3" height="10" fill="currentColor"/>
            <rect x="8" y="2" width="3" height="10" fill="currentColor"/>
          </svg>
        ) : (
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
            <path d="M3 2l9 5-9 5V2z" fill="currentColor"/>
          </svg>
        )}
      </IconBtn>
      <div style={{ fontFamily: mono, fontSize: 12, fontVariantNumeric: 'tabular-nums', width: 64, textAlign: 'right', color: '#f6f4ef' }}>
        {fmt(time)}
      </div>
      <div ref={trackRef}
        onMouseMove={onTrackMove}
        onMouseLeave={() => { if (!dragging) onHover(null); }}
        onMouseDown={(e) => { setDragging(true); onSeek(timeFromEvent(e)); onHover(null); }}
        style={{ flex: 1, height: 22, position: 'relative', cursor: 'pointer', display: 'flex', alignItems: 'center' }}>
        <div style={{ position: 'absolute', left: 0, right: 0, height: 4, background: 'rgba(255,255,255,0.12)', borderRadius: 2 }}/>
        <div style={{ position: 'absolute', left: 0, width: `${pct}%`, height: 4, background: 'oklch(72% 0.12 250)', borderRadius: 2 }}/>
        <div style={{ position: 'absolute', left: `${pct}%`, top: '50%', width: 12, height: 12, marginLeft: -6, marginTop: -6, background: '#fff', borderRadius: 6, boxShadow: '0 2px 4px rgba(0,0,0,0.4)' }}/>
      </div>
      <div style={{ fontFamily: mono, fontSize: 12, fontVariantNumeric: 'tabular-nums', width: 64, textAlign: 'left', color: 'rgba(246,244,239,0.55)' }}>
        {fmt(duration)}
      </div>
    </div>
  );
}

function IconBtn({ children, onClick, title }) {
  const [hover, setHover] = useState(false);
  return (
    <button onClick={onClick} title={title}
      onMouseEnter={() => setHover(true)} onMouseLeave={() => setHover(false)}
      style={{
        width: 28, height: 28, display: 'flex', alignItems: 'center', justifyContent: 'center',
        background: hover ? 'rgba(255,255,255,0.12)' : 'rgba(255,255,255,0.04)',
        border: '1px solid rgba(255,255,255,0.1)', borderRadius: 6, color: '#f6f4ef',
        cursor: 'pointer', padding: 0, transition: 'background 120ms',
      }}>
      {children}
    </button>
  );
}

function PhoneFrame({ children, width = 360, height = 740, dark = true }) {
  return (
    <div style={{

      </div>
    </div>

function TapPulse({ x, y, delay = 0 }) {
  const { localTime } = useSprite();
  const t = clamp((localTime - delay) / 0.8, 0, 1);
  if (t <= 0) return null;
  return (
    <div style={{ position: 'absolute', left: x, top: y, pointerEvents: 'none' }}>
      <div style={{
        position: 'absolute', left: -40, top: -40, width: 80, height: 80, borderRadius: '50%',
        border: `3px solid ${BRAND.asiacellOrange}`,
        opacity: (1 - t) * 0.9, transform: `scale(${0.4 + t * 1.6})`,
      }} />
      <div style={{
        position: 'absolute', left: -16, top: -16, width: 32, height: 32, borderRadius: '50%',
        background: BRAND.asiacellOrange, boxShadow: `0 0 20px ${BRAND.asiacellOrange}`,
        opacity: 1 - t * 0.3, transform: `scale(${1 - t * 0.2})`,
      }} />
    </div>
  );
}

      <div style={{ position: 'absolute', top: IS_PORTRAIT ? 70 : 90, right: IS_PORTRAIT ? 50 : 100, opacity: 0.95 }}>
        <img src={BRAND.asiacellLogoSrc} alt="Asiacell" style={{ height: IS_PORTRAIT ? 70 : 100, width: 'auto', filter: 'brightness(0) invert(1)' }} />
      </div>

      {/* Phone */}
      <div style={{
        position: 'absolute',
        left: IS_PORTRAIT ? (STAGE_W - 460) / 2 : 220,
        top: IS_PORTRAIT ? 240 : 85,
        opacity: phoneOpacity,
        transform: `translateY(${phoneTy}px) scale(${phoneScale})`,
        transformOrigin: 'center top', willChange: 'transform, opacity',
      }}>
        <PhoneFrame width={460} height={950}>
          <ScreenComp />
        </PhoneFrame>
      </div>

      {/* Caption */}
      <div style={{
        position: 'absolute',
        right: IS_PORTRAIT ? 0 : 100,
        left: IS_PORTRAIT ? 0 : 'auto',
        top: IS_PORTRAIT ? 1280 : 320,
        width: IS_PORTRAIT ? '100%' : 880,
        padding: IS_PORTRAIT ? '0 60px' : 0,
        direction: 'rtl', fontFamily: '"Tajawal", "Cairo", system-ui',
        textAlign: IS_PORTRAIT ? 'center' : 'right',
        opacity: capOp, transform: `translateY(${capTy}px)`,
      }}>
        <div style={{
          display: 'inline-flex', alignItems: 'center', gap: 12,
          background: 'rgba(227,6,19,0.15)', border: `2px solid ${BRAND.asiacellOrange}`,
          borderRadius: 100, padding: IS_PORTRAIT ? '8px 22px' : '10px 28px',
          fontSize: IS_PORTRAIT ? 20 : 24, fontWeight: 700, color: BRAND.asiacellOrange,
          marginBottom: IS_PORTRAIT ? 22 : 32, direction: 'rtl',
        }}>
          <span>الخطوة {arabicNums[stepNum]}</span>
        </div>
        <div style={{ fontSize: IS_PORTRAIT ? 76 : 104, fontWeight: 800, color: '#fff', lineHeight: 1.15, letterSpacing: '-0.01em', marginBottom: IS_PORTRAIT ? 20 : 28, textShadow: '0 4px 30px rgba(0,0,0,0.5)' }}>
          {captionAr}
        </div>
        {subAr && (
          <div style={{ fontSize: IS_PORTRAIT ? 26 : 34, fontWeight: 500, color: 'rgba(255,255,255,0.78)', lineHeight: 1.4 }}>
            {subAr}
          </div>
        )}
      </div>

      {/* Progress dots */}
      <div style={{ position: 'absolute', left: 0, right: 0, bottom: 90, display: 'flex', gap: 18, alignItems: 'center', justifyContent: 'center' }}>
        {[1,2,3,4,5,6,7].map(i => {
          const isActive = i === stepNum;
          const isDone = i < stepNum;
          return (
            <div key={i} style={{
              width: isActive ? 48 : 12, height: 12, borderRadius: 6,
              background: isActive ? BRAND.asiacellOrange : (isDone ? BRAND.asiacellOrangeDeep : 'rgba(255,255,255,0.25)'),
              transition: 'all 300ms',
            }} />
          );
        })}
      </div>
    </div>
  );
}

function SceneEnd() {
  const { progress } = useSprite();
  const t = Easing.easeOutCubic(clamp(progress * 1.5, 0, 1));
  const exit = clamp((progress - 0.85) / 0.15, 0, 1);
  const tagP = clamp((progress - 0.15) / 0.7, 0, 1);
  const tagIn = Easing.easeOutCubic(clamp(tagP / 0.2, 0, 1));
  const tagOut = clamp((progress - 0.88) / 0.12, 0, 1);
  const tagOp = tagIn * (1 - tagOut);
  const tagTy = (1 - tagIn) * 30 - tagOut * 16;
  const urlOp = clamp((progress - 0.3) * 3, 0, 1) * (1 - tagOut);

  return (
    <div style={{
      position: 'absolute', inset: 0,
      background: `linear-gradient(135deg, #000 0%, #1a0508 40%, ${BRAND.asiacellOrangeDeep} 100%)`,
      overflow: 'hidden',
    }}>
      <svg width="100%" height="100%" style={{ position: 'absolute', inset: 0, opacity: t * 0.25 }}>
        {[...Array(16)].map((_, i) => {
          const angle = (i / 16) * Math.PI * 2;
          const len = 1200;
          const cx = STAGE_W / 2, cy = STAGE_H / 2;
          return <line key={i} x1={cx} y1={cy} x2={cx + Math.cos(angle) * len * t} y2={cy + Math.sin(angle) * len * t} stroke={BRAND.asiacellOrange} strokeWidth="2" opacity="0.3" />;
        })}
      </svg>
      <div style={{
        position: 'absolute', left: '50%', top: '50%', width: 1200, height: 1200, borderRadius: '50%',
        background: `radial-gradient(circle, ${BRAND.asiacellOrange}66 0%, transparent 60%)`,
        transform: `translate(-50%, -50%) scale(${0.5 + t * 0.8})`,
        filter: 'blur(60px)', opacity: 1 - exit,
      }} />
      <div style={{
        position: 'absolute', left: 0, right: 0, top: IS_PORTRAIT ? 620 : 320,
        display: 'flex', alignItems: 'center', justifyContent: 'center',
        gap: IS_PORTRAIT ? 36 : 80,
        opacity: (1 - exit) * t, transform: `scale(${0.85 + t * 0.15})`,
      }}>
        <img src={BRAND.asiacellLogoSrc} alt="Asiacell" style={{ height: IS_PORTRAIT ? 140 : 220, width: 'auto', filter: 'brightness(0) invert(1)' }} />
        <div style={{ fontSize: IS_PORTRAIT ? 70 : 100, fontWeight: 200, color: 'rgba(255,255,255,0.6)', fontFamily: 'system-ui' }}>×</div>
        <div style={{ fontFamily: '"Bebas Neue", "Oswald", Impact, sans-serif', fontSize: IS_PORTRAIT ? 130 : 160, fontWeight: 900, color: '#fff', letterSpacing: '0.02em', transform: 'scaleY(1.15)', textShadow: '0 8px 40px rgba(0,0,0,0.5)', lineHeight: 0.85 }}>NETFLIX</div>
      </div>
      <div style={{
        position: 'absolute', left: 0, right: 0, top: IS_PORTRAIT ? 1100 : 680,
        textAlign: 'center', direction: 'rtl', fontFamily: '"Tajawal", "Cairo", system-ui',
        padding: IS_PORTRAIT ? '0 50px' : 0,
        opacity: tagOp, transform: `translateY(${tagTy}px)`,
      }}>
        <div style={{ fontSize: IS_PORTRAIT ? 90 : 104, fontWeight: 800, color: '#fff', lineHeight: 1.15, textShadow: '0 4px 30px rgba(0,0,0,0.4)' }}>
          استمتع بالمشاهدة
        </div>
        <div style={{ marginTop: 18, fontSize: IS_PORTRAIT ? 30 : 38, fontWeight: 500, color: 'rgba(255,255,255,0.78)' }}>
          ادفع من رصيد آسياسيل · بدون بطاقة ائتمان
        </div>
      </div>
      <div style={{
        position: 'absolute', bottom: IS_PORTRAIT ? 100 : 80, left: 0, right: 0,
        textAlign: 'center', opacity: urlOp,
        color: 'rgba(255,255,255,0.7)', fontFamily: '"JetBrains Mono", monospace',
        fontSize: IS_PORTRAIT ? 22 : 26, letterSpacing: '0.05em',
      }}>netflix.com/iq</div>
    </div>
  );
}

// ═══════════════════════════════════════════════════════════════
// MAIN APP
// Timeline:
//  0–3    Asiacell brand intro
//  3–7    Hero — Asiacell × Netflix
//  7–11   Step 1 — Netflix Iraq URL
// 11–15   Step 2 — Email signin
// 15–19   Step 3 — Choose plan
// 19–23   Step 4 — Choose Asiacell payment
// 23–27   Step 5 — Phone number
// 27–31   Step 6 — OTP
// 31–35   Step 7 — SMS confirmation
// 35–39   End card
// ═══════════════════════════════════════════════════════════════

const TOTAL = 39;

function Step1Wrap() {
  const { progress } = useSprite();
  return <Screen1_URL progress={clamp(progress * 1.4, 0, 1)} />;
}
function Step2Wrap() {
  const { progress } = useSprite();
  return <Screen2_Email progress={clamp(progress * 1.3, 0, 1)} />;
}
function Step3Wrap() {
  const { progress } = useSprite();
  const sel = progress < 0.4 ? 0 : (progress < 0.7 ? 2 : 1);
  return <Screen3_Plan selected={sel} />;
}
function Step4Wrap() {
  const { progress } = useSprite();
  return <Screen4_Payment highlight={progress > 0.35} />;
}
function Step5Wrap() {
  const { progress } = useSprite();
  return <Screen5_Phone progress={clamp(progress * 1.4, 0, 1)} />;
}
function Step6Wrap() {
  const { progress } = useSprite();
  return <Screen6_OTP filled={Math.min(6, Math.floor(progress * 8))} />;
}
function Step7Wrap() {
  const { progress } = useSprite();
  return <Screen7_SMS progress={clamp(progress * 1.4, 0, 1)} />;
}

function BottomChip() {
  return (
    <div style={{
      position: 'absolute', left: 60, bottom: 60,
      display: 'flex', alignItems: 'center', gap: 14,
      padding: '14px 22px',
      background: 'rgba(255,255,255,0.05)', backdropFilter: 'blur(20px)',
      border: '1px solid rgba(255,255,255,0.1)', borderRadius: 100,
    }}>
      <div style={{ fontFamily: '"Bebas Neue", Impact, sans-serif', fontSize: 22, color: '#E50914', fontWeight: 900, letterSpacing: '0.05em', transform: 'scaleY(1.15)' }}>NETFLIX</div>
      <div style={{ width: 1, height: 16, background: 'rgba(255,255,255,0.2)' }} />
      <img src={BRAND.asiacellLogoSrc} alt="Asiacell" style={{ height: 26, width: 'auto', filter: 'brightness(0) invert(1)' }} />
    </div>
  );
}

function App() {
  return (
    <Stage width={STAGE_W} height={STAGE_H} duration={TOTAL} background="#000" persistKey="asiacell-netflix">
      <Sprite start={0} end={3}><SceneIntro /></Sprite>
      <Sprite start={3} end={7}><SceneHero /></Sprite>

      <Sprite start={7} end={11}>
        <StepScene stepNum={1} captionAr="افتح الرابط"
          subAr={<>توجه إلى <span style={{direction:'ltr', display:'inline-block', color: BRAND.asiacellOrangeLight, fontWeight: 700, fontFamily: 'JetBrains Mono'}}>netflix.com/iq</span> من متصفحك</>}
          ScreenComp={Step1Wrap} />
      </Sprite>

      <Sprite start={11} end={15}>
        <StepScene stepNum={2} captionAr="سجّل الدخول"
          subAr="باستخدام بريدك الإلكتروني، ثم اضغط «التالي»"
          ScreenComp={Step2Wrap} />
      </Sprite>

      <Sprite start={15} end={19}>
        <StepScene stepNum={3} captionAr="اختر نوع الاشتراك"
          subAr="ثلاث باقات تناسب احتياجاتك من Mobile إلى Premium"
          ScreenComp={Step3Wrap} />
      </Sprite>

      <Sprite start={19} end={23}>
        <StepScene stepNum={4} captionAr="اختر آسياسيل"
          subAr="كطريقة للدفع — الدفع مباشرة من رصيد هاتفك"
          ScreenComp={Step4Wrap} />
      </Sprite>

      <Sprite start={23} end={27}>
        <StepScene stepNum={5} captionAr="أدخل رقم هاتفك"
          subAr="رقمك المسجّل لدى آسياسيل"
          ScreenComp={Step5Wrap} />
      </Sprite>

      <Sprite start={27} end={31}>
        <StepScene stepNum={6} captionAr="أدخل رمز التحقق"
          subAr="رمز OTP المرسل عبر رسالة نصية لإتمام عملية الدفع"
          ScreenComp={Step6Wrap} />
      </Sprite>

      <Sprite start={31} end={35}>
        <StepScene stepNum={7} captionAr="تم الاشتراك بنجاح"
          subAr="ستصلك رسالة نصية بتفاصيل عملية الدفع وتأكيد الاشتراك"
          ScreenComp={Step7Wrap} />
      </Sprite>

      <Sprite start={35} end={39}><SceneEnd /></Sprite>

      <Sprite start={7} end={35}><BottomChip /></Sprite>
    </Stage>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
