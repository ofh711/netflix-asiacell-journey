<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<title>Asiacell × Netflix — Key Visual</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&family=Cairo:wght@400;600;700;800;900&family=Sora:wght@400;600;700;800&family=Bebas+Neue&family=Oswald:wght@700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --ac-red: #E30613;
    --ac-red-deep: #B5050F;
    --ac-red-light: #FF2D3A;
    --nf-red: #E50914;
    --nf-red-deep: #B0060F;
  }
  html, body { margin: 0; padding: 0; background: #000; overflow: hidden; }
  body { font-family: 'Tajawal', system-ui, sans-serif; }
  * { box-sizing: border-box; }

  .kv {
    position: absolute; top: 0; left: 0;
    background:
      radial-gradient(ellipse at 70% 40%, rgba(227,6,19,0.35) 0%, transparent 55%),
      radial-gradient(ellipse at 20% 80%, rgba(229,9,20,0.20) 0%, transparent 60%),
      linear-gradient(135deg, #0a0000 0%, #1a0508 35%, #2a0a10 70%, #0d0205 100%);
    overflow: hidden;
    color: #fff;
  }
  .aspect-1x1  .kv { width: 1080px; height: 1080px; }
  .aspect-9x16 .kv { width: 1080px; height: 1920px; }
  .aspect-16x9 .kv { width: 1920px; height: 1080px; }

  /* Soft red glow blob */
  .glow {
    position: absolute;
    width: 1100px; height: 1100px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(227,6,19,0.45) 0%, transparent 60%);
    filter: blur(80px);
    pointer-events: none;
  }
  /* Subtle texture lines (sun-rays) */
  .rays { position: absolute; inset: 0; opacity: 0.18; mix-blend-mode: screen; pointer-events: none; }

  /* === Phone === */
  .phone-wrap { position: absolute; transform-origin: center; }
  .phone {
    width: 460px; height: 950px;
    background: #0a0a0a;
    border-radius: 60px;
    padding: 8px;
    box-shadow:
      0 80px 140px rgba(0,0,0,0.85),
      0 30px 60px rgba(227,6,19,0.18),
      0 0 0 2px #2a2a2a,
      inset 0 0 0 2px #1a1a1a;
  }
  .phone-screen {
    width: 100%; height: 100%;
    background: #000;
    border-radius: 50px;
    overflow: hidden;
    position: relative;
  }
  .island {
    position: absolute;
    top: 14px; left: 50%; transform: translateX(-50%);
    width: 130px; height: 36px;
    background: #000;
    border-radius: 18px;
    z-index: 50;
  }
  .home-bar {
    position: absolute;
    bottom: 8px; left: 50%; transform: translateX(-50%);
    width: 150px; height: 5px; border-radius: 3px;
    background: rgba(255,255,255,0.7);
    z-index: 50;
  }

  /* === Netflix-like UI === */
  .nf-ui {
    width: 100%; height: 100%;
    background: linear-gradient(180deg, #000 0%, #150305 60%, #000 100%);
    direction: ltr;
    padding-top: 56px;
    color: #fff;
    overflow: hidden;
  }
  .nf-statusbar {
    position: absolute; top: 0; left: 0; right: 0; height: 44px;
    display: flex; justify-content: space-between; align-items: center;
    padding: 16px 28px 0;
    font-family: -apple-system, system-ui;
    font-size: 15px; font-weight: 600;
    z-index: 30;
  }
  .nf-statusbar svg rect { fill: #fff; }
  .nf-topbar {
    display: flex; justify-content: space-between; align-items: center;
    padding: 8px 22px 6px;
  }
  .nf-logo {
    font-family: 'Bebas Neue', Impact, sans-serif;
    font-size: 36px;
    color: #E50914;
    font-weight: 900;
    letter-spacing: 0.05em;
    transform: scaleY(1.15);
    text-shadow: 0 4px 18px rgba(229,9,20,0.6);
  }
  .nf-avatar {
    width: 28px; height: 28px;
    border-radius: 6px;
    background: linear-gradient(135deg, #ff8a00, #ff3d3d);
  }
  .nf-tabs {
    display: flex; gap: 22px; padding: 4px 22px 14px;
    font-size: 13px; font-weight: 600; color: rgba(255,255,255,0.85);
  }
  .nf-tabs .active { color: #fff; }
  .nf-tabs .muted { color: rgba(255,255,255,0.55); }

  .nf-hero {
    margin: 0 16px 22px;
    height: 360px;
    border-radius: 14px;
    background:
      radial-gradient(ellipse at 30% 30%, rgba(229,9,20,0.6) 0%, transparent 60%),
      linear-gradient(135deg, #1a0508 0%, #4a0612 50%, #0a0205 100%);
    position: relative;
    overflow: hidden;
    box-shadow: 0 14px 40px rgba(0,0,0,0.6);
  }
  .nf-hero::after {
    content: '';
    position: absolute; inset: 0;
    background: linear-gradient(180deg, transparent 50%, rgba(0,0,0,0.85) 100%);
  }
  .nf-hero-tag {
    position: absolute; top: 14px; right: 14px;
    background: rgba(0,0,0,0.5);
    padding: 4px 10px; border-radius: 4px;
    font-size: 11px; font-weight: 700;
    color: #fff;
    letter-spacing: 0.1em;
    backdrop-filter: blur(10px);
  }
  .nf-hero-title {
    position: absolute;
    bottom: 60px; left: 16px; right: 16px;
    text-align: right;
    direction: rtl;
    font-family: 'Tajawal', sans-serif;
    font-size: 28px;
    font-weight: 900;
    color: #fff;
    line-height: 1.1;
    text-shadow: 0 4px 20px rgba(0,0,0,0.9);
    z-index: 5;
  }
  .nf-hero-meta {
    position: absolute;
    bottom: 36px; left: 16px;
    display: flex; gap: 8px;
    font-size: 11px;
    color: rgba(255,255,255,0.8);
    z-index: 5;
  }
  .nf-hero-meta span {
    background: rgba(0,0,0,0.4);
    padding: 3px 8px; border-radius: 3px;
  }
  .nf-hero-cta {
    position: absolute;
    bottom: 14px; left: 16px; right: 16px;
    display: flex; gap: 8px; z-index: 5;
  }
  .nf-cta-play {
    flex: 1;
    background: #fff; color: #000;
    padding: 10px;
    border-radius: 6px;
    font-size: 14px; font-weight: 700;
    text-align: center;
    direction: rtl;
  }
  .nf-cta-info {
    flex: 1;
    background: rgba(120,120,120,0.55); color: #fff;
    padding: 10px;
    border-radius: 6px;
    font-size: 14px; font-weight: 700;
    text-align: center;
    direction: rtl;
  }

  .nf-row { padding: 0 16px 18px; }
  .nf-row-title {
    color: #fff;
    font-size: 17px;
    font-weight: 700;
    margin-bottom: 10px;
    direction: rtl;
    text-align: right;
    font-family: 'Tajawal', sans-serif;
  }
  .nf-tiles { display: flex; gap: 8px; }
  .nf-tile {
    width: 96px; height: 144px;
    border-radius: 6px;
    flex-shrink: 0;
    position: relative;
    overflow: hidden;
  }
  .nf-tile::after {
    content: '';
    position: absolute; inset: 0;
    background: linear-gradient(180deg, transparent 60%, rgba(0,0,0,0.5) 100%);
  }
  .nf-tile-rank {
    position: absolute;
    top: 4px; right: 6px;
    font-family: 'Bebas Neue', Impact, sans-serif;
    font-size: 14px;
    font-weight: 900;
    color: rgba(255,255,255,0.95);
    text-shadow: 0 2px 6px rgba(0,0,0,0.8);
    letter-spacing: 0.05em;
    z-index: 4;
  }

  /* === Logo lockup === */
  .lockup {
    position: absolute;
    display: flex;
    align-items: center;
    line-height: 1;
  }
  .lockup img {
    width: auto;
    filter: brightness(0) invert(1);
  }
  .lockup .x {
    font-weight: 200;
    color: rgba(255,255,255,0.55);
    font-family: system-ui;
  }
  .lockup .nf-mark {
    font-family: 'Bebas Neue', Impact, sans-serif;
    font-weight: 900;
    color: #E50914;
    letter-spacing: 0.02em;
    transform: scaleY(1.15);
    line-height: 0.85;
    text-shadow: 0 8px 40px rgba(229,9,20,0.7);
  }

  /* === Tagline === */
  .tagline {
    position: absolute;
    direction: rtl;
    font-family: 'Tajawal', 'Cairo', system-ui;
  }
  .tagline-main {
    font-weight: 800;
    color: #fff;
    line-height: 1.15;
    letter-spacing: -0.01em;
    text-shadow: 0 6px 40px rgba(0,0,0,0.6);
  }
  .tagline-sub {
    margin-top: 14px;
    font-weight: 500;
    color: rgba(255,255,255,0.78);
    line-height: 1.4;
  }

  /* === CTA bar === */
  .cta-bar {
    position: absolute;
    direction: rtl;
    display: flex; align-items: center;
    background: rgba(255,255,255,0.06);
    backdrop-filter: blur(20px);
    border: 1.5px solid rgba(255,255,255,0.12);
    border-radius: 100px;
    box-shadow: 0 14px 40px rgba(0,0,0,0.4);
  }
  .cta-pill {
    background: linear-gradient(135deg, var(--ac-red-light), var(--ac-red-deep));
    color: #fff;
    border-radius: 100px;
    font-family: 'Tajawal', sans-serif;
    font-weight: 700;
    box-shadow: 0 6px 20px rgba(227,6,19,0.5);
  }
  .cta-url {
    font-family: 'JetBrains Mono', monospace;
    color: rgba(255,255,255,0.85);
    direction: ltr;
    letter-spacing: 0.05em;
  }

  /* ===== 1:1 layout ===== */
  .aspect-1x1 .glow { top: -180px; right: -150px; }
  .aspect-1x1 .lockup { top: 60px; left: 50%; transform: translateX(-50%); gap: 24px; }
  .aspect-1x1 .lockup img { height: 80px; }
  .aspect-1x1 .lockup .x { font-size: 46px; }
  .aspect-1x1 .lockup .nf-mark { font-size: 80px; }
  .aspect-1x1 .phone-wrap {
    left: 50%; top: 180px;
    transform: translateX(-50%) scale(0.6);
    transform-origin: center top;
  }
  .aspect-1x1 .tagline { top: 770px; left: 0; right: 0; text-align: center; padding: 0 60px; }
  .aspect-1x1 .tagline-main { font-size: 60px; }
  .aspect-1x1 .tagline-sub { font-size: 22px; margin-top: 8px; }
  .aspect-1x1 .cta-bar { bottom: 50px; left: 50%; transform: translateX(-50%); gap: 14px; padding: 8px 12px 8px 26px; }
  .aspect-1x1 .cta-pill { padding: 14px 28px; font-size: 18px; }
  .aspect-1x1 .cta-url { font-size: 16px; padding: 0 8px; }

  /* ===== 9:16 layout ===== */
  .aspect-9x16 .glow { top: 600px; right: -200px; }
  .aspect-9x16 .lockup { top: 130px; left: 50%; transform: translateX(-50%); gap: 30px; }
  .aspect-9x16 .lockup img { height: 110px; }
  .aspect-9x16 .lockup .x { font-size: 60px; }
  .aspect-9x16 .lockup .nf-mark { font-size: 110px; }
  .aspect-9x16 .phone-wrap { left: 50%; top: 380px; transform: translateX(-50%) scale(1); }
  .aspect-9x16 .tagline { bottom: 280px; left: 0; right: 0; text-align: center; padding: 0 60px; }
  .aspect-9x16 .tagline-main { font-size: 84px; }
  .aspect-9x16 .tagline-sub { font-size: 30px; margin-top: 16px; }
  .aspect-9x16 .cta-bar { bottom: 110px; left: 50%; transform: translateX(-50%); gap: 16px; padding: 10px 14px 10px 28px; }
  .aspect-9x16 .cta-pill { padding: 16px 34px; font-size: 22px; }
  .aspect-9x16 .cta-url { font-size: 20px; padding: 0 10px; }

  /* ===== 16:9 layout ===== */
  .aspect-16x9 .glow { top: -100px; left: -200px; }
  .aspect-16x9 .lockup { top: 110px; right: 100px; gap: 50px; }
  .aspect-16x9 .lockup img { height: 130px; }
  .aspect-16x9 .lockup .x { font-size: 80px; }
  .aspect-16x9 .lockup .nf-mark { font-size: 140px; }
  .aspect-16x9 .phone-wrap {
    left: 110px; top: 50%;
    transform: translateY(-50%) rotate(-7deg) scale(0.94);
  }
  .aspect-16x9 .tagline { bottom: 240px; right: 100px; width: 920px; text-align: right; }
  .aspect-16x9 .tagline-main { font-size: 92px; }
  .aspect-16x9 .tagline-sub { font-size: 30px; margin-top: 20px; }
  .aspect-16x9 .cta-bar { bottom: 90px; right: 100px; gap: 16px; padding: 10px 14px 10px 28px; }
  .aspect-16x9 .cta-pill { padding: 16px 34px; font-size: 22px; }
  .aspect-16x9 .cta-url { font-size: 20px; padding: 0 10px; }
</style>
</head>
<body>
<div class="kv">
  <div class="glow"></div>

  <div class="phone-wrap">
    <div class="phone">
      <div class="phone-screen">
        <div class="island"></div>
        <div class="nf-ui">
          <div class="nf-statusbar">
            <span>9:41</span>
            <span style="display:flex;gap:6px;align-items:center;">
              <svg width="18" height="11" viewBox="0 0 18 11"><rect x="0" y="6" width="3" height="5" rx="0.6"/><rect x="5" y="4" width="3" height="7" rx="0.6"/><rect x="10" y="2" width="3" height="9" rx="0.6"/><rect x="15" y="0" width="3" height="11" rx="0.6"/></svg>
              <svg width="24" height="11" viewBox="0 0 24 11"><rect x="0.5" y="0.5" width="20" height="10" rx="2.5" stroke="rgba(255,255,255,0.5)" fill="none"/><rect x="2" y="2" width="17" height="7" rx="1" fill="#fff"/></svg>
            </span>
          </div>

          <div class="nf-topbar">
            <div class="nf-logo">NETFLIX</div>
            <div class="nf-avatar"></div>
          </div>
          <div class="nf-tabs">
            <span class="active">الرئيسية</span>
            <span class="muted">مسلسلات</span>
            <span class="muted">أفلام</span>
            <span class="muted">جديد</span>
          </div>

          <div class="nf-hero">
            <div class="nf-hero-tag">جديد على نتفلكس</div>
            <div class="nf-hero-title">المسلسل العراقي الأكثر مشاهدةً</div>
            <div class="nf-hero-meta">
              <span>2026</span><span>13+</span><span>دراما</span>
            </div>
            <div class="nf-hero-cta">
              <div class="nf-cta-play">▶  تشغيل</div>
              <div class="nf-cta-info">＋  قائمتي</div>
            </div>
          </div>

          <div class="nf-row">
            <div class="nf-row-title">الأكثر مشاهدةً في العراق اليوم</div>
            <div class="nf-tiles">
              <div class="nf-tile" style="background: linear-gradient(135deg, #6e0000 0%, #e50914 100%);"><div class="nf-tile-rank">#1</div></div>
              <div class="nf-tile" style="background: linear-gradient(135deg, #003e7e 0%, #0070d8 100%);"><div class="nf-tile-rank">#2</div></div>
              <div class="nf-tile" style="background: linear-gradient(135deg, #2e0e2e 0%, #8e2ee5 100%);"><div class="nf-tile-rank">#3</div></div>
              <div class="nf-tile" style="background: linear-gradient(135deg, #5e3500 0%, #e57c14 100%);"><div class="nf-tile-rank">#4</div></div>
            </div>
          </div>
        </div>
        <div class="home-bar"></div>
      </div>
    </div>
  </div>

  <div class="lockup">
    <img src="project/assets/asiacell-logo.png" alt="Asiacell" />
    <div class="x">×</div>
    <div class="nf-mark">NETFLIX</div>
  </div>

  <div class="tagline">
    <div class="tagline-main">مشاهدة بلا حدود</div>
    <div class="tagline-sub">اشترك مباشرةً من رصيد آسياسيل · بدون بطاقة ائتمان</div>
  </div>

  <div class="cta-bar">
    <div class="cta-pill">اشترك الآن</div>
    <div class="cta-url">netflix.com/iq</div>
  </div>
</div>

<script>
  const aspect = new URLSearchParams(location.search).get('aspect') || '1x1';
  document.body.classList.add('aspect-' + aspect);
</script>
</body>
</html>
